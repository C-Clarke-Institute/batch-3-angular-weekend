
<div class="app-product">
  <p highlight>{{ title }}</p>
  <p>Discount : {{discount}}%</p>
  <p highlight [ngStyle]="{
  'color' : stock > 0 ? 'black' : 'red',
  'font-size.px' : fontSize
  }">Price : ${{price}}</p>
  <p [class.out-of-stock]="stock == 0">Stock : {{stock}}</p>

  @if ( discount > 0) {
    <p highlight >Discount Price : ${{ price - ( price * discount / 100) }}</p>
  }
  @else {
    <p>No Discount</p>
  }

  <button [disabled]="stock==0" [ngClass]="{ 'disabled' : stock == 0 , 'product-add-button' : true }" (click)="onClick()" >Add</button>
  <button [hidden]="stock==0" [ngClass]="{ 'product-add-button' : true }" (click)="onIncrement()" >Increment</button>

</div>
